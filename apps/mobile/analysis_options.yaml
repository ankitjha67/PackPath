include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    sort_pub_dependencies: false
    require_trailing_commas: true
    avoid_print: true

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    # Vendored upstream plugin (patched for Flutter 3.41). We deliberately do
    # not restyle third-party code to our lint rules.
    - third_party/**
