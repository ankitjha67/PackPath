name: packpath

services:
  # The PackPath API. `docker compose up` brings up the whole stack — Postgres
  # (with PostGIS), Redis and the backend — ready for the mobile app to point
  # at http://<this-host>:8000. Set MSG91_* for real SMS OTP; leave blank to
  # run in dev-OTP mode (the code is returned in the API response).
  backend:
    build: ../apps/backend
    container_name: packpath-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql+asyncpg://packpath:packpath@postgres:5432/packpath
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-PACKPT}
    ports:
      - "8000:8000"

  postgres:
    # TimescaleDB image includes PostGIS — one container, both extensions.
    image: timescale/timescaledb-ha:pg16
    container_name: packpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: packpath
      POSTGRES_PASSWORD: packpath
      POSTGRES_DB: packpath
    ports:
      - "5432:5432"
    volumes:
      # Named volume (not a host bind mount): the timescaledb-ha image must
      # chown/chmod its data dir, which fails on a Windows bind mount
      # ("Operation not permitted"). A Docker-managed volume avoids that.
      - pgdata:/home/postgres/pgdata/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packpath -d packpath"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: packpath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
